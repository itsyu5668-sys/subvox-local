# Subvox Local — build a real Intel .app + .dmg on a Mac in the cloud.
#
# Runs on a GitHub-hosted macOS runner and produces:
#   build/Subvox Local.dmg   (uploaded as a workflow artifact, always)
#   + a GitHub Release asset when the run is triggered by a version tag.
#
# RUNNER HISTORY (honest):
# - First version used runs-on: macos-13, the last Intel (x86_64)
#   GitHub-hosted label. That run (41219119999) sat QUEUED for 11+
#   minutes with no runner ever assigned: the macos-13 label is gone
#   from GitHub's runner list. macos-14 was retired 1 Oct 2026 too.
# - This version therefore runs on macos-15 (Apple Silicon, arm64)
#   and CROSS-COMPILES x86_64 under Rosetta 2: an x86_64 Python
#   (python.org universal2 installer, run via `arch -x86_64`) builds
#   the PyInstaller backend, and swiftc already targets
#   x86_64-apple-macosx14.0. The output .app/.dmg are still x86_64
#   and run natively on Francis's Intel Mac (and under Rosetta on
#   Apple Silicon). This is a cross-compile, NOT a native Intel build.
#   If the cross-compile proves flaky, the remaining honest option is
#   a self-hosted Intel Mac runner — there is no GitHub-hosted Intel
#   runner left.
# - The .dmg is UNSIGNED (no SIGN_IDENTITY in CI). Gatekeeper will
#   block a plain double-click on other Macs; right-click > Open works.
#   Signing + notarization need an Apple Developer account and are NOT
#   wired up here.
# - A green build does NOT mean the app works end to end. Known gaps
#   (see packaging/README.md): the live-dictation bridge is still
#   missing (BackendBridge never calls launcher.sh, no JSON-lines
#   streaming mode in the Python backend). FIXED since this header was
#   written: the first-launch downloader now has the real Qwen GGUF
#   URL + SHA-256 (core set is 1.62 GB), and license keys now need the
#   SUBVOX-XXXX format + checksum (format check only, not crypto
#   security). The CI smoke test only proves the backend binary starts.
# - FAILURE HISTORY (so the next person does not re-diagnose it):
#   run 5 (41222863743) failed building llama-cpp-python 0.3.36 from
#   source: ld: symbol(s) not found for architecture x86_64 (_X509_*,
#   _SSL_*). Root cause was NOT the llama-server binary (its commit
#   message said so — wrong): CMake found the host's arm64 Homebrew
#   OpenSSL 4.1.0 while targeting x86_64, and the link failed in
#   libllama-common's cpp-httplib TLS code. Fix, in build_app.sh:
#   export CMAKE_ARGS="-DLLAMA_OPENSSL=OFF -DLLAMA_BUILD_SERVER=OFF"
#   BEFORE any pip install / uv sync (run 10 proved the wheel then
#   builds: "Successfully built subvox-local llama-cpp-python").
#   Run 10 then failed in swiftc only:
#   swift/PaywallView.swift:238:82: error: extra argument 'specifier'
#   in call. Run 11 (the fix for that, dropping the specifier) went
#   GREEN 2026-10-31 19:10 UTC: first .dmg artifact, ~434 MB
#   (subvox-local-intel-dmg, run 41231078252).
# - The retired hand-built script .app (CFBundleExecutable = a bash
#   script) opened Script Editor on double-click. Both build_app.sh
#   (step 4b) and the "Verify CFBundleExecutable" step below now fail
#   the build if the executable is not a Mach-O 64-bit x86_64 binary.
#   Never ship a script as CFBundleExecutable again.
# - set -e is on everywhere (build scripts use `set -euo pipefail`);
#   nothing here swallows errors or fakes success.

name: Build macOS Intel .dmg

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # needed only for the tag-triggered Release upload

jobs:
  build-intel-dmg:
    runs-on: macos-15  # Apple Silicon host; x86_64 is cross-compiled (see header)
    env:
      X86_64_PYTHON: /Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Confirm Apple Silicon host
        run: |
          set -euo pipefail
          echo "OS: $(sw_vers -productVersion)  arch: $(uname -m)"
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "ERROR: this fallback workflow expects an arm64 macos-15 host, got $(uname -m)."
            exit 1
          fi

      - name: Install Rosetta 2
        run: |
          set -euo pipefail
          if pgrep -q oahd; then
            echo "Rosetta already installed."
          else
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true
          echo "Rosetta OK."

      - name: Install x86_64 Python 3.12 (python.org universal2)
        run: |
          set -euo pipefail
          # Universal2 installer; the x86_64 slice is used via arch -x86_64.
          curl -fsSL -o /tmp/python-3.12.7.pkg \
            https://www.python.org/ftp/python/3.12.7/python-3.12.7-macos11.pkg
          sudo installer -pkg /tmp/python-3.12.7.pkg -target /
          arch -x86_64 "$X86_64_PYTHON" --version
          MACHINE="$(arch -x86_64 "$X86_64_PYTHON" -c 'import platform; print(platform.machine())')"
          echo "Python reports machine: $MACHINE"
          if [[ "$MACHINE" != "x86_64" ]]; then
            echo "ERROR: expected the x86_64 slice, got $MACHINE."
            exit 1
          fi

      - name: Build Subvox Local.app (x86_64 cross-compile)
        run: ./packaging/build_app.sh --allow-cross

      - name: Verify the .app is really x86_64
        run: |
          set -euo pipefail
          file "build/Subvox Local.app/Contents/MacOS/SubvoxLocal"
          file "build/Subvox Local.app/Contents/Resources/subvox-backend/subvox-local"
          lipo -archs "build/Subvox Local.app/Contents/MacOS/SubvoxLocal" | grep -q x86_64
          echo "x86_64 arch confirmed."

      - name: Verify CFBundleExecutable is a compiled binary (never a script)
        run: |
          set -euo pipefail
          APP="build/Subvox Local.app"
          EXEC_NAME="$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Contents/Info.plist")"
          echo "CFBundleExecutable: $EXEC_NAME"
          EXEC_PATH="$APP/Contents/MacOS/$EXEC_NAME"
          file "$EXEC_PATH"
          if ! file "$EXEC_PATH" | grep -q "Mach-O 64-bit executable x86_64"; then
            echo "ERROR: $EXEC_PATH is not a Mach-O 64-bit x86_64 binary."
            echo "A script as CFBundleExecutable opens Script Editor on"
            echo "double-click (the retired click-to-open .app bug)."
            echo "Fix the swiftc step; never ship a script as the executable."
            echo "Fallback: packaging/launcher-swift/README.md"
            exit 1
          fi
          echo "CFBundleExecutable is a compiled x86_64 binary."

      - name: Build Subvox Local.dmg
        run: ./packaging/build_dmg.sh

      - name: Verify .dmg
        run: |
          set -euo pipefail
          ls -lh "build/Subvox Local.dmg"
          hdiutil verify "build/Subvox Local.dmg"
          shasum -a 256 "build/Subvox Local.dmg"

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: subvox-local-intel-dmg
          path: "build/Subvox Local.dmg"
          if-no-files-found: error
          retention-days: 90

      - name: Attach .dmg to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "build/Subvox Local.dmg"
          generate_release_notes: true
